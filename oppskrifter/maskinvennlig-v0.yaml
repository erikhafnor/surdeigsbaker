# Maskinvennlig oppskrift v0 – UTKAST
#
# Dette er både (1) hypotesen H0 fra docs/01-prosessanalyse.md og
# (2) et utkast til oppskriftsformatet som fastvarens oppskriftsmotor skal lese.
# Formatet er inspirert av trinnlister med inngangs- og utgangsbetingelser
# (jf. Anova-ovnens API). Det er ikke frosset, og endringer er forventet.
#
# Maskinen slutter når deigen er KLAR FOR FORMING (ADR-007). Forming, kald etterheving
# i brukerens kjøleskap og steking i vanlig ovn (ADR-006) gjøres av mennesket og er
# beskrevet under `manuelle_trinn` nederst.
#
# Fastvaren i firmware/v0/ leser ikke denne fila ennå. Verdiene er lagt inn som
# innstillinger der (blanding, fermentolyse, elting, bretting, bulk).
#
# Alle mengder er plassholdere til eksperiment E01 har gjort skjeemål om til gram.

format: surdeigsbaker-oppskrift/0.3
navn: Maskinvennlig v0
basert_paa: referanse-v7
status: utkast

# Totalmengder for hele deigen, inkludert det som går til levain og saltlake (gram)
ingredienser:
  mel_siktet: 500        # inkl. 40 g i levain
  mel_sammalt: 110       # inkl. 10 g i levain
  vann: 470              # inkl. 50 g i levain og vannet i saltlaken. Gir ca. 77 % hydrering.
  salt: 12               # ca. 2 %, dosert som 20 % saltlake (60 g lake = 12 g salt + 48 g vann)
  surdeig_start: 20      # ca. 1 ss fra kjøleskapet. Tilsettes av mennesket (N2/N3).

maal:
  klar_for_forming_kl: null   # f.eks. "20:00". Tidsplanleggeren regner baklengs (kommer, se docs/01).
  deigtemperatur: 26     # ønsket deigtemperatur (DDT), °C
  overlevering: B        # B = «med forming» (standard i v0), A = «tipp og stek». Avgjøres av E06.
  varsler_tillatt: "07:00-23:00"   # tidsrom maskinen kan be om manuelle grep

trinn:
  - id: levain
    doser: {mel_siktet: 40, mel_sammalt: 10, vann: 50}
    vanntemperatur: 26
    bland: {hastighet: lav, tid: 60s}
    hold: {temperatur: 26}
    ferdig_naar:
      en_av:
        - heving_relativ: ">= 2.0"   # krever ToF-sensor over bollen (E14)
        - modell: levain_topp        # fermenteringsmodell fra E02
      maks_tid: 12h
      ved_tidsavbrudd: varsle_og_vent

  - id: fermentolyse                 # erstatter autolysen (E04)
    doser: {mel_siktet: rest, mel_sammalt: rest, vann: rest_unntatt_saltlake}
    vanntemperatur: beregn_fra_ddt   # 4 × DDT − (mel + rom + levain + friksjon)
    bland: {hastighet: lav, tid: 3min}
    hold: {temperatur: 26, tid: 40min}

  - id: salt_og_elting
    doser: {saltlake: 60}
    bland: {hastighet: lav, tid: 10min}

  - id: bulk
    hold: {temperatur: 26}
    bearbeid: {hver: 30min, antall: 4, hastighet: svaert_lav, tid: 15s}   # E05
    ferdig_naar:
      en_av:
        - heving_relativ: ">= 1.25"  # kalibreres i E01/E09
        - modell: bulk_slutt
      maks_tid: 5h

  - id: klar_for_forming             # maskinen er ferdig (ADR-007)
    hold: {temperatur: av}           # ingen kjøling: varmen slås av og deigen venter ved romtemperatur
    varsle: "Deigen er klar for forming. Form den, legg den i kurven og sett den i kjøleskapet."
    paaminnelse_etter: 60min         # E16 bestemmer hvor lenge deigen kan vente
    ferdig_naar: {bruker_kvitterer: true}

# Det mennesket gjør etter overleveringen (vises i appen og i brukerveiledningen).
# Profilen er fra referanseoppskriften og optimaliseres i E08.
manuelle_trinn:
  - "Variant B: Vend deigen ut på benken, forform, la den hvile 20 min og gi den endelig form. Legg den i en melet hevekurv."
  - "Variant A: Sett lokk eller plast på bollen."
  - "Sett kurven (eller bollen) i kjøleskapet ved 4–6 °C i 8–24 t."
  - "Forvarm ovnen med jerngryta og lokket på nederste rille til 260 °C. Vent minst 10 min etter at ovnen har nådd temperaturen."
  - "Strø litt helkorn i gryta, tipp den kalde deigen i og snitt (2–3 mm i luftig deig)."
  - "Stek 20 min ved 250 °C med lokk, deretter 25 min ved 200 °C uten lokk."
  - "Kjernetemperatur ≥ 96 °C. La brødet avkjøles på rist i 1–2 t."

# Sikkerhetsgrenser som oppskriften ALDRI kan overstyre. De håndheves av maskinvaren
# og fastvaren uavhengig av oppskriften. Verdiene står her bare som informasjon (v0).
#   deig_maks: 32 °C (fastvare, bolleveggen)
#   varmeplate_maks: 38 °C (fastvare, kan settes til maks 45 °C)
#   KSD301: 60 °C, manuell reset · termosikring: 77 °C (maskinvare)
#   motor: maks 4 A i 2 s (fastvare), sikring 5 A (maskinvare)
#   feil: varme av, motor av, varsle
